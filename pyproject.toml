[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packforge"
version = "0.1.0"
description = "Reusable cell-to-system battery design workbench (TELIPORT S4, Case Study 2)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pydantic>=2.6", "pandas>=2.0", "plotly>=5.20", "streamlit>=1.35"]

[project.optional-dependencies]
dev = ["pytest>=8,<9.2"]  # 9.2.0 crashes with INTERNALERROR in this env

[tool.setuptools]
packages = ["packforge"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
